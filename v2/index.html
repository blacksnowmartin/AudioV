<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AudioV</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="hud">
      <h1>AudioV</h1>
      <p>Load a track or enable your microphone to drive a live Three.js visualizer.</p>
      <div class="controls">
        <label class="button">
          <span>Load track</span>
          <input id="fileInput" type="file" accept="audio/*" />
        </label>
        <button id="micButton" type="button">Use microphone</button>
        <button id="playButton" type="button" disabled>Play</button>
      </div>
      <div id="status" class="status">Waiting for audio input…</div>
    </div>

    <div id="app"></div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
